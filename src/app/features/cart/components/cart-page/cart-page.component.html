<div *ngIf="totalitems>0; else emptyCart">
    <div class="cart-header" >
<h3>your Cart</h3>
</div>
<div class="main-container">
    <div class="my-card">
        
    <div *ngFor="let item of cartItems" class="cart-item">
    <app-menu-card [item]="item"
        [cart]="cartItems"
        (add)="menuservice.addToCart($event)"
        (inc)="menuservice.increase($event)"
        (dec)="menuservice.decrease($event)">></app-menu-card>
    </div>
</div>
<div class="d-flex justify-content-center cart-summary">
     <app-cart-summary [id]="cartItems[0].restaurantId"></app-cart-summary>
</div>
</div>
</div>
  <ng-template #emptyCart>

    <app-empty-cart></app-empty-cart>

  </ng-template>
