<div *ngIf="totalitems>0; else emptyCart">
    <div class="cart-header" >
<h3>your Cart</h3>
</div>
<div class="main-container">
    <div class="my-card">
        
    <div *ngFor="let item of cartItems " class="cart-item">
    <app-menu-card [item]="item"
        [cart]="cartItems"
        (add)="menuservice.addToCart($event)"
        (inc)="menuservice.increase($event)"
        (dec)="menuservice.decrease($event)">></app-menu-card>
    </div>
    <app-offers [id]="restaurantid"
     ></app-offers>
    
    <div style="margin-top: 5%;"><app-address-form></app-address-form></div>
</div>
<div style="height:120px;"></div>
<div class="d-flex justify-content-center cart-summary" >
     <app-cart-summary [id]="cartItems[0].restaurantId"
     [component]="cval"></app-cart-summary>
     
</div>
</div>
</div>
  <ng-template #emptyCart>

  <div class="desktop-frame">
      
     
      <div class="state-box">
        <div class="state-icon">🛒</div>
        <div class="state-title">Your cart is empty</div>
        <div class="state-sub">Looks like you haven't added anything yet. Browse restaurants and add items to get started!</div>
        <button class="state-btn" routerLink="/home">Browse restaurants</button>
        
      </div>
    </div>

  </ng-template>
