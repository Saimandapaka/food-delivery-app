        <form #addressForm="ngForm" (ngSubmit)="validation(addressForm)">


<div class="m" style="border-radius: 50px;"  >

   

    <!-- Address Type -->

    <div  class="content-card">
        <div>
        <div class="cc-header" *ngIf="!ismobile">
        <div class="cc-title">Add new address</div>
        <div class="cc-action" style="color:#555;" (click)="changeDisplay()">
            ← Back to addresses
        </div>
    </div>
    
        <div class="nb-m" *ngIf="ismobile" >
            <div class="nb-back" >
                ←
            </div>
            <div class="nb-title-m">
                Add new address
            </div>
        </div>
    </div>
        <div style="margin-bottom:16px;">
        <div class="field-label"
            style="font-size:12px;color:#9e9e9e;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">
            Address type
        </div>

        <div style="display:flex;gap:10px;">
            <div [class.type-active]="type==='Home'" [class.type-notactive]="type!=='Home'"  (click)="type='Home'">
                🏠 Home
            </div>

            <div [class.type-active]="type==='Work'" [class.type-notactive]="type!=='Work'"  (click)="type='Work'">
                💼 Work
            </div>

            <div [class.type-active]="type==='Other'" [class.type-notactive]="type!=='Other'"  (click)="type='Other'">
                📍 Other
            </div>
        </div>
    </div> 

    <div class="form-grid">

        <!-- Flat -->

        <div class="field">
            <div class="field-label">Flat / House no.</div>

            <input
                type="text"
                name="flat"
                [(ngModel)]="flat"
                #flatRef="ngModel"
                required
                class="field-input"
                placeholder="e.g. Flat 4B"
                [class.invalid]="flatRef.invalid && (flatRef.touched || addressForm.submitted)">

            <small class="error"
                *ngIf="flatRef.invalid && (flatRef.touched || addressForm.submitted)">
                Flat / House No is required
            </small>
        </div>

        <!-- Building -->

        <div class="field">

            <div class="field-label">Building / Society</div>

            <input
                type="text"
                name="building"
                [(ngModel)]="building"
                #buildingRef="ngModel"
                required
                class="field-input"
                placeholder="e.g. Prestige Towers"
                [class.invalid]="buildingRef.invalid && (buildingRef.touched || addressForm.submitted)">

            <small class="error"
                *ngIf="buildingRef.invalid && (buildingRef.touched || addressForm.submitted)">
                Building is required
            </small>

        </div>

        <!-- Street -->

        <div class="field">

            <div class="field-label">Street / Area</div>

            <input
                type="text"
                name="street"
                [(ngModel)]="street"
                #streetRef="ngModel"
                required
                class="field-input"
                placeholder="e.g. Banjara Hills"
                [class.invalid]="streetRef.invalid && (streetRef.touched || addressForm.submitted)">

            <small class="error"
                *ngIf="streetRef.invalid && (streetRef.touched || addressForm.submitted)">
                Street is required
            </small>

        </div>

        <!-- City -->

        <div class="field">

            <div class="field-label">City</div>

            <input
                type="text"
                name="city"
                [(ngModel)]="city"
                #cityRef="ngModel"
                required
                class="field-input"
                placeholder="e.g. Hyderabad"
                [class.invalid]="cityRef.invalid && (cityRef.touched || addressForm.submitted)">

            <small class="error"
                *ngIf="cityRef.invalid && (cityRef.touched || addressForm.submitted)">
                City is required
            </small>

        </div>

        <!-- State -->

        <div class="field">

            <div class="field-label">State</div>

            <input
                type="text"
                name="state"
                [(ngModel)]="state"
                #stateRef="ngModel"
                required
                class="field-input"
                placeholder="e.g. Telangana"
                [class.invalid]="stateRef.invalid && (stateRef.touched || addressForm.submitted)">

            <small class="error"
                *ngIf="stateRef.invalid && (stateRef.touched || addressForm.submitted)">
                State is required
            </small>

        </div>

        <!-- Pincode -->

        <div class="field">

            <div class="field-label">Pincode</div>

            <input
                type="text" 
                name="pincode"
                [(ngModel)]="pincode"
                #pinRef="ngModel"
                required
                class="field-input"
                placeholder="e.g. 500034"
                [class.invalid]="pinRef.invalid && (pinRef.touched || addressForm.submitted)">

            <small class="error"
                *ngIf="pinRef.invalid && (pinRef.touched || addressForm.submitted)">
                Pincode is required
            </small>

        </div>

    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
        <input type="checkbox" id="default-addr">
        <label for="default-addr">Set as default delivery address</label>
    </div>

    <div *ngIf="!ismobile">
        
        <button type="button" class="cancel-btn" (click)="changeDisplay()">
           Cancel
        </button>

        <button type="submit" class="save-btn" >
            Save Address
        </button>
        
    </div>
    <div *ngIf="ismobile">
         
        <button class="m-save-btn" type="submit">Save Address</button>
        <button (click)="changeDisplay()" style="width:100%;background:white;color:#e53935;border:1.5px solid #e53935;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;">Cancel</button>
    </div>
    </div>

</div>

        </form>
